name: toeic_speaking
description: TOEIC Speaking 파트별 실전 연습 웹앱
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.27 이상 (Color.withValues 사용)
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^5.1.2 # 브라우저 MediaRecorder 녹음
  audioplayers: ^6.1.0 # 녹음 재생
  idb_shim: ^2.6.1 # IndexedDB 저장
  http: ^1.2.2 # blob URL → 바이트 변환
  intl: ^0.19.0
  image_picker: ^1.2.3
  flutter_tts: ^4.2.5
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # 문항 이미지(Q3-4 사진 묘사). 파일을 넣기만 하면 되고,
    # 개별 파일을 여기에 나열할 필요는 없다.
    - assets/images/questions/
