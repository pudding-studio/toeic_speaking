name: toeic_speaking
description: TOEIC Speaking 파트별 실전 연습 웹앱
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.27 이상 (Color.withValues 사용)
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^5.1.2 # 브라우저 MediaRecorder 녹음
  audioplayers: ^6.1.0 # 녹음 재생
  idb_shim: ^2.6.1 # IndexedDB 저장
  http: ^1.2.2 # blob URL → 바이트 변환
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
