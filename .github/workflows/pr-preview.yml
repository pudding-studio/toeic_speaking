name: PR 미리보기 (Firebase Hosting)

# PR 마다 임시 미리보기 URL 을 만들고 PR 에 댓글로 남긴다.
# 포크에서 올라온 PR 은 시크릿에 접근할 수 없으므로 건너뛴다.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: firebase-preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  preview:
    name: 미리보기 배포
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: 배포 설정 확인
        id: config
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$PROJECT_ID" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_PROJECT_ID / FIREBASE_SERVICE_ACCOUNT 가 설정되지 않아 미리보기를 건너뜁니다."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.config.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 웹 빌드
        if: steps.config.outputs.ready == 'true'
        run: |
          flutter pub get
          flutter build web --release

      - name: 미리보기 채널 배포
        if: steps.config.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.number }}
          expires: 7d
