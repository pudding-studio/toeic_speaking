name: Deploy (Firebase Hosting)

# 기본 브랜치에 푸시되면 라이브 채널로 배포한다.
# 브랜치 이름을 고정하지 않고 저장소의 기본 브랜치와 비교하므로,
# 나중에 기본 브랜치를 main 으로 바꿔도 그대로 동작한다.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  deploy:
    name: 빌드 후 배포
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Firebase 설정이 아직 없으면 실패시키지 않고 건너뛴다.
      # (설정 방법은 README 의 "자동 배포" 참고)
      - name: 배포 설정 확인
        id: config
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$PROJECT_ID" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "### 배포 대상: \`$PROJECT_ID\` (live)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            [ -z "$PROJECT_ID" ] && echo "::warning::저장소 변수 FIREBASE_PROJECT_ID 가 없습니다."
            [ -z "$SERVICE_ACCOUNT" ] && echo "::warning::시크릿 FIREBASE_SERVICE_ACCOUNT 가 없습니다."
            {
              echo "### 배포를 건너뛰었습니다"
              echo ""
              echo "Settings > Secrets and variables > Actions 에서 아래를 등록하면 다음 푸시부터 자동 배포됩니다."
              echo ""
              echo "- Variable \`FIREBASE_PROJECT_ID\` — Firebase 프로젝트 ID"
              echo "- Secret \`FIREBASE_SERVICE_ACCOUNT\` — 서비스 계정 JSON 전체"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.config.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 의존성 설치
        if: steps.config.outputs.ready == 'true'
        run: flutter pub get

      - name: 검증
        if: steps.config.outputs.ready == 'true'
        run: |
          flutter analyze
          flutter test

      - name: 웹 빌드
        if: steps.config.outputs.ready == 'true'
        run: flutter build web --release

      - name: Firebase Hosting 배포
        if: steps.config.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
